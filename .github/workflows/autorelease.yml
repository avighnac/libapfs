name: autorelease

on:
  push:
    branches: main

jobs:
  build-linux-x86:
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Install packages
      run: |
        sudo apt update
        sudo apt install gcc
        sudo apt install g++
        sudo apt install cmake
        sudo apt install zip
        sudo apt install meson ninja-build

    - name: Set variables and compile
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_STATIC=True
        cmake --build build --parallel

        mv build/src/cli/apfs build/src/apfs-linux-x86-64

        mkdir -p package/include
        cp -R include/. package/include/
        cp build/src/lib/libapfs.a package/

        (
          cd package
          zip -r ../build/src/libapfs-linux-x86-64.zip include libapfs.a
        )

    - name: Upload executable and library for linux-x86-64
      uses: actions/upload-artifact@v4
      with:
        name: apfs-linux-x86-64
        path: |
          build/src/apfs-linux-x86-64
          build/src/libapfs-linux-x86-64.zip

  build-linux-arm64:
    permissions: write-all
    runs-on: ubuntu-24.04-arm
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Install packages
      run: |
        sudo apt update
        sudo apt install gcc
        sudo apt install g++
        sudo apt install cmake
        sudo apt install zip
        sudo apt install meson ninja-build

    - name: Set variables and compile
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_STATIC=True
        cmake --build build --parallel

        mv build/src/cli/apfs build/src/apfs-linux-arm64

        mkdir -p package/include
        cp -R include/. package/include/
        cp build/src/lib/libapfs.a package/

        (
          cd package
          zip -r ../build/src/libapfs-linux-arm64.zip include libapfs.a
        )

    - name: Upload executable and library for linux-arm64
      uses: actions/upload-artifact@v4
      with:
        name: apfs-linux-arm64
        path: |
          build/src/apfs-linux-arm64
          build/src/libapfs-linux-arm64.zip

  build-windows-x86:
    permissions: write-all
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Install packages
      run: |
        Invoke-WebRequest -OutFile file.zip https://github.com/brechtsanders/winlibs_mingw/releases/download/15.2.0posix-13.0.0-ucrt-r6/winlibs-x86_64-posix-seh-gcc-15.2.0-mingw-w64ucrt-13.0.0-r6.zip
        Expand-Archive file.zip -DestinationPath .

    - name: Build with MinGW
      run: |
        $toolroot = Join-Path $PWD "mingw64"
        cmake -S . -B build-mingw -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release -DBUILD_STATIC=True -DCMAKE_C_COMPILER="$toolroot/bin/gcc.exe" -DCMAKE_CXX_COMPILER="$toolroot/bin/g++.exe"
        cmake --build build-mingw --parallel

    - name: Package MinGW build
      run: |
        Move-Item build-mingw/src/cli/apfs.exe build-mingw/src/apfs-windows-x86-64.exe
        New-Item -ItemType Directory -Force package-mingw/include
        Copy-Item include/* package-mingw/include -Recurse
        Copy-Item build-mingw/src/lib/libapfs.a package-mingw/libapfs.a
        Compress-Archive -Path package-mingw/include,package-mingw/libapfs.a -DestinationPath build-mingw/src/libapfs-windows-x86-64-mingw.zip

    - name: Build with MSVC
      run: |
        cmake -S . -B build-msvc -A x64 -DBUILD_STATIC=True
        cmake --build build-msvc --config Release --target libapfs --parallel

    - name: Package MSVC build
      run: |
        New-Item -ItemType Directory -Force package-msvc/include
        Copy-Item include/* package-msvc/include -Recurse
        Copy-Item build-msvc/src/lib/Release/apfs.lib package-msvc/apfs.lib
        Compress-Archive -Path package-msvc/include,package-msvc/apfs.lib -DestinationPath build-msvc/libapfs-windows-x86-64-msvc.zip

    - name: Upload executable and library for windows-x86-64
      uses: actions/upload-artifact@v4
      with:
        name: apfs-windows-x86-64
        path: |
          build-mingw/src/apfs-windows-x86-64.exe
          build-mingw/src/libapfs-windows-x86-64-mingw.zip
          build-msvc/libapfs-windows-x86-64-msvc.zip

  build-windows-arm64:
    permissions: write-all
    runs-on: windows-11-arm
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Install packages
      run: |
        Invoke-WebRequest -OutFile file.zip https://github.com/mstorsjo/llvm-mingw/releases/download/20260311/llvm-mingw-20260311-ucrt-aarch64.zip
        Expand-Archive file.zip -DestinationPath .

    - name: Build with MinGW
      run: |
        $toolroot = Join-Path $PWD "llvm-mingw-20260311-ucrt-aarch64"
        cmake -S . -B build-mingw -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release -DBUILD_STATIC=True -DCMAKE_C_COMPILER="$toolroot/bin/clang.exe" -DCMAKE_CXX_COMPILER="$toolroot/bin/clang++.exe"
        cmake --build build-mingw --parallel

    - name: Package MinGW build
      run: |
        Move-Item build-mingw/src/cli/apfs.exe build-mingw/src/apfs-windows-arm64.exe
        New-Item -ItemType Directory -Force package-mingw/include
        Copy-Item include/* package-mingw/include -Recurse
        Copy-Item build-mingw/src/lib/libapfs.a package-mingw/libapfs.a
        Compress-Archive -Path package-mingw/include,package-mingw/libapfs.a -DestinationPath build-mingw/src/libapfs-windows-arm64-mingw.zip

    - name: Build with MSVC
      run: |
        cmake -S . -B build-msvc -A ARM64 -DBUILD_STATIC=True
        cmake --build build-msvc --config Release --target libapfs --parallel

    - name: Package MSVC build
      run: |
        New-Item -ItemType Directory -Force package-msvc/include
        Copy-Item include/* package-msvc/include -Recurse
        Copy-Item build-msvc/src/lib/Release/apfs.lib package-msvc/apfs.lib
        Compress-Archive -Path package-msvc/include,package-msvc/apfs.lib -DestinationPath build-msvc/libapfs-windows-arm64-msvc.zip

    - name: Upload executable and library for windows-arm64
      uses: actions/upload-artifact@v4
      with:
        name: apfs-windows-arm64
        path: |
          build-mingw/src/apfs-windows-arm64.exe
          build-mingw/src/libapfs-windows-arm64-mingw.zip
          build-msvc/libapfs-windows-arm64-msvc.zip

  build-macos-arm64:
    permissions: write-all
    runs-on: macos-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Install GCC and compile
      run: |
        brew install gcc

        GCC="$(find "$(brew --prefix gcc)/bin" -maxdepth 1 -type f -name 'gcc-[0-9]*' | head -1)"
        GXX="$(find "$(brew --prefix gcc)/bin" -maxdepth 1 -type f -name 'g++-[0-9]*' | head -1)"

        cmake -S . -B build \
          -DCMAKE_BUILD_TYPE=Release -DBUILD_STATIC=True \
          -DCMAKE_C_COMPILER="$GCC" \
          -DCMAKE_CXX_COMPILER="$GXX"

        cmake --build build --parallel

        mv build/src/cli/apfs build/src/apfs-macos-arm64

        mkdir -p package/include
        cp -R include/. package/include/
        cp build/src/lib/libapfs.a package/

        (
          cd package
          zip -r ../build/src/libapfs-macos-arm64.zip include libapfs.a
        )

    - name: Upload executable and library for macos-arm64
      uses: actions/upload-artifact@v4
      with:
        name: apfs-macos-arm64
        path: |
          build/src/apfs-macos-arm64
          build/src/libapfs-macos-arm64.zip

  build-macos-x86:
    permissions: write-all
    runs-on: macos-26-intel
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Install GCC and compile
      run: |
        brew install gcc

        GCC="$(find "$(brew --prefix gcc)/bin" -maxdepth 1 -type f -name 'gcc-[0-9]*' | head -1)"
        GXX="$(find "$(brew --prefix gcc)/bin" -maxdepth 1 -type f -name 'g++-[0-9]*' | head -1)"

        cmake -S . -B build \
          -DCMAKE_BUILD_TYPE=Release -DBUILD_STATIC=True \
          -DCMAKE_C_COMPILER="$GCC" \
          -DCMAKE_CXX_COMPILER="$GXX"

        cmake --build build --parallel

        mv build/src/cli/apfs build/src/apfs-macos-x86-64

        mkdir -p package/include
        cp -R include/. package/include/
        cp build/src/lib/libapfs.a package/

        (
          cd package
          zip -r ../build/src/libapfs-macos-x86-64.zip include libapfs.a
        )

    - name: Upload executable and library for macos-x86-64
      uses: actions/upload-artifact@v4
      with:
        name: apfs-macos-x86-64
        path: |
          build/src/apfs-macos-x86-64
          build/src/libapfs-macos-x86-64.zip

  create-release:
    needs:
      - build-linux-x86
      - build-linux-arm64
      - build-windows-x86
      - build-windows-arm64
      - build-macos-arm64
      - build-macos-x86

    permissions: write-all
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Download executable and library for linux-x86-64
      uses: actions/download-artifact@v4
      with:
        name: apfs-linux-x86-64

    - name: Download executable and library for linux-arm64
      uses: actions/download-artifact@v4
      with:
        name: apfs-linux-arm64

    - name: Download executable and library for windows-x86-64
      uses: actions/download-artifact@v4
      with:
        name: apfs-windows-x86-64

    - name: Download executable and library for windows-arm64
      uses: actions/download-artifact@v4
      with:
        name: apfs-windows-arm64

    - name: Download executable and library for macos-arm64
      uses: actions/download-artifact@v4
      with:
        name: apfs-macos-arm64

    - name: Download executable and library for macos-x86-64
      uses: actions/download-artifact@v4
      with:
        name: apfs-macos-x86-64

    - name: Set necessary variables
      run: |
        TAG="0.1"

        SUFFIX=$(
          curl -s "https://api.github.com/repos/avighnac/libapfs/tags?per_page=100" |
          jq -r --arg base "$TAG" '
            [.[].name
            | select(startswith($base + "-alpha-"))
            | sub("^" + $base + "-alpha-"; "")
            | tonumber]
            | (max // 0) + 1
          '
        )

        VERSION_="$TAG-alpha-$SUFFIX"
        YEAR=$(date +"%Y")
        RELEASE_NAME="apfs $VERSION_"

        echo "VERSION_=$VERSION_" >> $GITHUB_ENV
        echo "RELEASE_NAME=$RELEASE_NAME" >> $GITHUB_ENV

    - name: Create a GitHub release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ env.VERSION_ }}
        release_name: ${{ env.RELEASE_NAME }}
        draft: false
        prerelease: true

    - name: Upload executable for linux-x86-64
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: apfs-linux-x86-64
        asset_name: apfs-linux-x86-64
        asset_content_type: application/x-executable

    - name: Upload library for linux-x86-64
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: libapfs-linux-x86-64.zip
        asset_name: libapfs-linux-x86-64.zip
        asset_content_type: application/zip

    - name: Upload executable for linux-arm64
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: apfs-linux-arm64
        asset_name: apfs-linux-arm64
        asset_content_type: application/x-executable

    - name: Upload library for linux-arm64
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: libapfs-linux-arm64.zip
        asset_name: libapfs-linux-arm64.zip
        asset_content_type: application/zip

    - name: Upload executable for windows-x86-64
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: apfs-windows-x86-64.exe
        asset_name: apfs-windows-x86-64.exe
        asset_content_type: application/x-executable

    - name: Upload MinGW library for windows-x86-64
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: libapfs-windows-x86-64-mingw.zip
        asset_name: libapfs-windows-x86-64-mingw.zip
        asset_content_type: application/zip

    - name: Upload MSVC library for windows-x86-64
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: libapfs-windows-x86-64-msvc.zip
        asset_name: libapfs-windows-x86-64-msvc.zip
        asset_content_type: application/zip

    - name: Upload executable for windows-arm64
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: apfs-windows-arm64.exe
        asset_name: apfs-windows-arm64.exe
        asset_content_type: application/x-executable

    - name: Upload MinGW library for windows-arm64
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: libapfs-windows-arm64-mingw.zip
        asset_name: libapfs-windows-arm64-mingw.zip
        asset_content_type: application/zip

    - name: Upload MSVC library for windows-arm64
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: libapfs-windows-arm64-msvc.zip
        asset_name: libapfs-windows-arm64-msvc.zip
        asset_content_type: application/zip

    - name: Upload executable for macos-arm64
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: apfs-macos-arm64
        asset_name: apfs-macos-arm64
        asset_content_type: application/x-executable

    - name: Upload library for macos-arm64
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: libapfs-macos-arm64.zip
        asset_name: libapfs-macos-arm64.zip
        asset_content_type: application/zip

    - name: Upload executable for macos-x86-64
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: apfs-macos-x86-64
        asset_name: apfs-macos-x86-64
        asset_content_type: application/x-executable

    - name: Upload library for macos-x86-64
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: libapfs-macos-x86-64.zip
        asset_name: libapfs-macos-x86-64.zip
        asset_content_type: application/zip